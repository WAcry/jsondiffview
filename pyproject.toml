[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"

[project]
name = "jsondiffview"
version = "3.0.0"
description = "Deterministic, review-oriented strict JSON diffs for humans"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
import-names = ["jsondiffview"]
authors = [
  { name = "David Zhang", email = "davidzhang2000@outlook.com" },
]
keywords = ["json", "diff", "cli", "terminal", "review"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.4.2,<8.5",
  "regex==2026.6.28",
  "wcwidth==0.8.2",
]

[project.urls]
Homepage = "https://github.com/WAcry/jsondiffview"
Repository = "https://github.com/WAcry/jsondiffview"
Issues = "https://github.com/WAcry/jsondiffview/issues"
Changelog = "https://github.com/WAcry/jsondiffview/releases"

[project.scripts]
jdv = "jsondiffview.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "packaging==26.2",
  "pytest>=8.4",
  "readme-renderer[md]>=45.0",
  "ruff>=0.12",
  "types-regex>=2026.6.28.20260630",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jsondiffview"]
core-metadata-version = "2.5"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.5"
include = [
  "/LICENSE",
  "/MIGRATING.md",
  "/README.md",
  "/benchmarks",
  "/playground",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests", "scripts/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".cursor", ".trellis"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
exclude = ["build"]
warn_unreachable = true
