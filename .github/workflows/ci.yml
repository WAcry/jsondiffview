name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src tests
      - run: uv run --locked pytest -q tests/integration/test_workflow_policy.py

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q

  archives:
    name: Archive validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev
      - run: uv build --no-sources
      - run: uvx --from check-wheel-contents==0.6.3 check-wheel-contents dist/*.whl
      - run: uv run --locked python scripts/validate_artifacts.py dist --rebuild-sdist

  clean-wheel:
    name: Clean wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build --wheel --no-sources
      - run: >-
          uv run --no-project --python ${{ matrix.python }}
          python scripts/validate_clean_install.py dist

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [static, tests, archives, clean-wheel]
    steps:
      - name: Require every quality job
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.archives.result }}" = "success"
          test "${{ needs.clean-wheel.result }}" = "success"
